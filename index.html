<script>

var SUPABASE_URL = "https://prarfxqazcusbpfgouxc.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByYXJmeHFhemN1c2JwZmdvdXhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTc5NzQsImV4cCI6MjA5NTg3Mzk3NH0.PtbPZiGVl7uolNmZOpGD5vC-3Qnb4L-cm8bDUcJIwcA";
var SB_H = {"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Prefer":"return=representation"};

function sbFetch(path, opts) {
  opts = opts || {};
  return fetch(SUPABASE_URL+"/rest/v1/"+path, Object.assign({headers:SB_H},opts))
    .then(function(r){ return r.ok ? r.text().then(function(t){ return t?JSON.parse(t):[]; }) : r.text().then(function(t){ throw new Error(t); }); });
}
window.dbLoad   = function(){ return sbFetch("firm_ledger_entries?select=*&order=date.desc"); };
window.dbInsert = function(row){ return sbFetch("firm_ledger_entries",{method:"POST",body:JSON.stringify(row)}); };
window.dbDelete = function(id){ return sbFetch("firm_ledger_entries?id=eq."+id,{method:"DELETE"}); };

// ── File to base64 ──
window.toB64 = function(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(r.result.split(",")[1]); };
    r.onerror=function(){ rej(new Error("Read failed")); };
    r.readAsDataURL(file);
  });
};

// ── Normalise MIME ──
window.normMime = function(fileType, fileName){
  var mt = fileType;
  if(!mt || mt==="application/octet-stream"){
    var ext=(fileName||"").split(".").pop().toLowerCase();
    if(ext==="pdf") mt="application/pdf";
    else if(ext==="jpg"||ext==="jpeg") mt="image/jpeg";
    else if(ext==="png") mt="image/png";
    else mt="text/plain";
  }
  return mt;
};

// ── AI Invoice Parser ──
window.parseInvoice = function(b64, fileType, fileName){
  var mt = window.normMime(fileType, fileName);
  var isDoc = mt==="application/pdf";
  var isImg = mt.indexOf("image/")===0;

  var instr = "You are an invoice data extractor. Extract all invoice details.\n"
    + "Return ONLY a valid JSON object with these exact keys (no markdown, no extra text):\n"
    + "invoiceNumber, date (YYYY-MM-DD), partyName, gstRate (number), gstAmount (number), totalAmount (number), type (purchase or sale), description\n"
    + "type=sale means we are the seller. type=purchase means we are the buyer.\n"
    + "totalAmount = grand total including GST. All numbers must be plain numbers.";

  var content;
  if(isDoc || isImg){
    content = [
      {type: isDoc?"document":"image", source:{type:"base64",media_type:mt,data:b64}},
      {type:"text",text:instr}
    ];
  } else {
    var text="";
    try{ text=atob(b64); }catch(e){ text=b64; }
    content = instr+"\n\nINVOICE TEXT:\n"+text.slice(0,4000);
  }

  return fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,messages:[{role:"user",content:content}]})
  })
  .then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error("API "+r.status+": "+t.slice(0,200)); });
    return r.json();
  })
  .then(function(data){
    if(data.type==="error") throw new Error(data.error&&data.error.message||"API error");
    var raw=(data.content||[]).map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
    if(!raw) throw new Error("Empty AI response");
    var m=raw.match(/\{[\s\S]*\}/);
    if(!m) throw new Error("No JSON in response: "+raw.slice(0,80));
    return JSON.parse(m[0]);
  });
};

// ── PDF Generator ──
window.generatePDF = function(opts){
  var sales=opts.sales, purchases=opts.purchases, expenses=opts.expenses;
  var tSB=opts.tSB, tSG=opts.tSG, tPB=opts.tPB, tPG=opts.tPG;
  var netProfit=opts.netProfit, gstPay=opts.gstPay, margin=opts.margin;
  var periodLabel=opts.periodLabel, firmName=opts.firmName||"FirmLedger", firmAddress=opts.firmAddress||"";
  var pn=function(v){return parseFloat(v)||0;};
  var fmtR=function(n){
    var abs=Math.abs(Number(n||0));
    var s=abs.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
    return (Number(n)<0?"(":"")+"\u20B9"+s+(Number(n)<0?")":"");
  };
  var sumField=function(arr,k){return arr.reduce(function(s,e){return s+pn(e[k]);},0);};
  var expBase=sumField(expenses,"base_amount");
  var totalCosts=tPB+expBase;

  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  var W=doc.internal.pageSize.getWidth();
  var H=doc.internal.pageSize.getHeight();
  var ML=15,MR=15,TW=W-ML-MR;
  var y=0;

  // Helpers
  var sf=function(size,style,r,g,b){
    doc.setFontSize(size);
    doc.setFont("helvetica",style||"normal");
    if(r!==undefined) doc.setTextColor(r,g,b);
  };
  var hline=function(yy,lw,r,g,b){
    doc.setDrawColor(r||220,g||226,b||235);
    doc.setLineWidth(lw||0.25);
    doc.line(ML,yy,W-MR,yy);
  };
  var checkPage=function(need){
    if(y+need>H-14){
      doc.addPage();
      // footer on previous page already drawn; draw on new
      y=22;
    }
  };

  // ── HEADER ──
  // Navy bar
  doc.setFillColor(10,22,50);
  doc.rect(0,0,W,50,"F");
  // Teal left accent
  doc.setFillColor(0,150,136);
  doc.rect(0,0,4,50,"F");
  // Firm name
  sf(20,"bold",255,255,255);
  doc.text(firmName.toUpperCase(),10,16);
  // Teal underline
  doc.setFillColor(0,150,136);
  doc.rect(10,18,Math.min(doc.getTextWidth(firmName.toUpperCase()),TW-10),0.8,"F");
  // Address
  sf(8,"normal",160,175,200);
  if(firmAddress) doc.text(firmAddress,10,25);
  // Report subtitle
  sf(9,"bold",0,200,180);
  doc.text("FINANCIAL SUMMARY & PROFITABILITY REPORT",10,firmAddress?33:27);
  sf(7.5,"normal",140,160,185);
  doc.text("Excluding GST / Taxes  |  All figures represent exact Taxable Value",10,firmAddress?39:34);
  // Date right
  var genDate=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
  sf(7.5,"normal",140,160,185);
  doc.text("Report Date: "+genDate,W-MR,33,{align:"right"});
  doc.text("Period: "+periodLabel,W-MR,39,{align:"right"});
  y=58;

  // ── KPI BOXES ──
  var kpis=[
    {l:"Total Sales (ex-GST)",    v:fmtR(tSB),       bg:[232,250,240],brd:[22,163,74], tx:[14,100,50]},
    {l:"Total Costs (ex-GST)",    v:fmtR(totalCosts), bg:[254,232,232],brd:[220,38,38],  tx:[150,20,20]},
    {l:"Net Profit (ex-GST)",     v:fmtR(netProfit),  bg:netProfit>=0?[219,234,254]:[254,232,232], brd:netProfit>=0?[37,99,235]:[220,38,38], tx:netProfit>=0?[20,60,160]:[150,20,20]},
    {l:"Net Margin",              v:margin+"%",       bg:[237,233,254],brd:[109,40,217],tx:[70,20,160]},
  ];
  var kw=(TW-9)/4;
  kpis.forEach(function(k,i){
    var kx=ML+i*(kw+3);
    // bg
    doc.setFillColor(k.bg[0],k.bg[1],k.bg[2]);
    doc.roundedRect(kx,y,kw,20,2,2,"F");
    // border
    doc.setDrawColor(k.brd[0],k.brd[1],k.brd[2]);
    doc.setLineWidth(0.4);
    doc.roundedRect(kx,y,kw,20,2,2,"S");
    // top accent bar
    doc.setFillColor(k.brd[0],k.brd[1],k.brd[2]);
    doc.rect(kx,y,kw,3,"F");
    // label
    sf(6.5,"bold",k.brd[0],k.brd[1],k.brd[2]);
    doc.text(k.l.toUpperCase(),kx+4,y+9);
    // value
    sf(9.5,"bold",k.tx[0],k.tx[1],k.tx[2]);
    doc.text(k.v,kx+4,y+17);
  });
  y+=28;

  // ── GST STRIP ──
  doc.setFillColor(245,247,252);
  doc.roundedRect(ML,y,TW,16,2,2,"F");
  doc.setDrawColor(220,226,235);
  doc.setLineWidth(0.25);
  doc.roundedRect(ML,y,TW,16,2,2,"S");
  sf(7,"bold",80,95,120);
  doc.text("GST RECONCILIATION",ML+4,y+6);
  var gc=[
    {l:"Output GST (Sales)",           v:fmtR(tSG),              c:[180,83,9]},
    {l:"Input GST / ITC (Purchases)",  v:fmtR(tPG),              c:[109,40,217]},
    {l:gstPay>=0?"Net GST Payable":"Net GST Refund Due", v:fmtR(Math.abs(gstPay)), c:gstPay>=0?[180,83,9]:[22,163,74]},
  ];
  var gcw=(TW-34)/3;
  gc.forEach(function(g,i){
    var gx=ML+32+i*(gcw+3);
    sf(6.5,"normal",130,145,165);
    doc.text(g.l,gx,y+6);
    sf(8.5,"bold",g.c[0],g.c[1],g.c[2]);
    doc.text(g.v,gx,y+13);
  });
  y+=22;

  // ── SECTION BUILDER ──
  var drawSection=function(num,title,rows,accentR,accentG,accentB,totalVal){
    checkPage(20);
    // Number pill
    doc.setFillColor(accentR,accentG,accentB);
    doc.roundedRect(ML,y,6,6,1,1,"F");
    sf(8,"bold",255,255,255);
    doc.text(num,ML+1.8,y+4.5);
    // Title
    sf(10.5,"bold",15,30,60);
    doc.text(title,ML+9,y+5);
    // Total right
    sf(8,"normal",80,95,120);
    doc.text(rows.length+" entries  |  Total: "+fmtR(totalVal),W-MR,y+5,{align:"right"});
    y+=9;
    // Accent line
    doc.setDrawColor(accentR,accentG,accentB);
    doc.setLineWidth(0.5);
    doc.line(ML,y,W-MR,y);
    y+=5;

    if(!rows.length){
      sf(8,"italic",130,145,165);
      doc.text("No entries for this period.",ML+4,y+4);
      y+=10;
      return;
    }

    var baseSum=sumField(rows,"base_amount");
    var gstSum=sumField(rows,"gst_amount");
    var totSum=sumField(rows,"total_amount");

    var body=rows.map(function(e,idx){
      return [
        String(idx+1),
        e.invoice_number||"—",
        e.party_name||"",
        (e.description||"").slice(0,30),
        e.date||"",
        fmtR(e.total_amount),
        (e.gst_rate||0)+"%",
        fmtR(e.gst_amount),
        fmtR(e.base_amount)
      ];
    });
    // subtotal footer row
    body.push(["","","","SUBTOTAL","",fmtR(totSum),"",fmtR(gstSum),fmtR(baseSum)]);

    doc.autoTable({
      startY:y,
      head:[["#","Inv#","Party / Vendor","Description","Date","Total","GST%","GST Amt","Taxable Value"]],
      body:body,
      styles:{fontSize:7.5,cellPadding:{top:3,bottom:3,left:2.5,right:2.5},textColor:[15,30,60],fillColor:[255,255,255],lineColor:[220,226,235],lineWidth:0.2,overflow:"ellipsize"},
      headStyles:{fillColor:[accentR,accentG,accentB],textColor:[255,255,255],fontStyle:"bold",fontSize:7,cellPadding:{top:4,bottom:4,left:2.5,right:2.5}},
      alternateRowStyles:{fillColor:[248,250,253]},
      margin:{left:ML,right:MR},
      theme:"grid",
      columnStyles:{
        0:{cellWidth:6,halign:"center"},
        1:{cellWidth:16,halign:"center"},
        2:{cellWidth:30},
        3:{cellWidth:34},
        4:{cellWidth:17,halign:"center"},
        5:{cellWidth:20,halign:"right"},
        6:{cellWidth:10,halign:"center"},
        7:{cellWidth:19,halign:"right"},
        8:{cellWidth:22,halign:"right"}
      },
      didParseCell:function(data){
        var lastRow=body.length-1;
        if(data.row.index===lastRow){
          data.cell.styles.fillColor=[240,244,250];
          data.cell.styles.fontStyle="bold";
          data.cell.styles.textColor=[accentR,accentG,accentB];
        }
      }
    });
    y=doc.lastAutoTable.finalY+4;

    // Subtotal badge
    doc.setFillColor(accentR,accentG,accentB);
    doc.roundedRect(W-MR-54,y,54,9,1.5,1.5,"F");
    sf(7,"bold",255,255,255);
    doc.text("SUBTOTAL (ex-GST):  "+fmtR(baseSum),W-MR-3,y+6,{align:"right"});
    y+=13;
  };

  drawSection("1","VERIFIED REVENUE  —  Sales (Excl. GST)",sales,22,163,74,tSB);
  drawSection("2","VERIFIED OPERATING COSTS  —  Purchases (Excl. GST)",purchases,220,38,38,tPB);
  if(expenses.length){
    drawSection("3","OTHER EXPENSES  (Excl. GST)",expenses,180,83,9,expBase);
  }

  // ── P&L STATEMENT ──
  var secN=expenses.length?"4":"3";
  checkPage(75);

  doc.setFillColor(10,22,50);
  doc.roundedRect(ML,y,6,6,1,1,"F");
  sf(8,"bold",255,255,255);
  doc.text(secN,ML+1.8,y+4.5);
  sf(10.5,"bold",15,30,60);
  doc.text("FINAL PROFITABILITY STATEMENT",ML+9,y+5);
  y+=9;
  doc.setDrawColor(10,22,50);
  doc.setLineWidth(0.5);
  doc.line(ML,y,W-MR,y);
  doc.setLineWidth(0.2);
  doc.line(ML,y+1.2,W-MR,y+1.2);
  y+=7;

  // P&L box
  var boxH=62;
  doc.setFillColor(250,252,255);
  doc.roundedRect(ML,y,TW,boxH,3,3,"F");
  doc.setDrawColor(10,22,50);
  doc.setLineWidth(0.4);
  doc.roundedRect(ML,y,TW,boxH,3,3,"S");
  // left teal bar
  doc.setFillColor(0,150,136);
  doc.rect(ML,y+3,3,boxH-6,"F");

  var lx=ML+8, vx=W-MR-4;
  var plRows=[
    {l:"Total Sales Revenue (Excl. GST)",   v:tSB,       plus:true},
    {l:"Less: Total Purchase Costs (Excl. GST)", v:tPB,  plus:false},
    {l:"Less: Other Expenses (Excl. GST)",   v:expBase,  plus:false},
  ];
  var ry=y+9;
  plRows.forEach(function(r){
    sf(8.5,"normal",40,55,75);
    doc.text(r.l,lx,ry);
    sf(8.5,"bold",r.plus?22:220, r.plus?163:38, r.plus?74:38);
    doc.text(fmtR(r.v),vx,ry,{align:"right"});
    ry+=8;
    doc.setDrawColor(220,226,235);
    doc.setLineWidth(0.15);
    doc.setLineDash([1,1.5],0);
    doc.line(lx,ry-3,vx,ry-3);
    doc.setLineDash([],0);
  });

  // Double rule
  ry+=2;
  doc.setDrawColor(10,22,50);
  doc.setLineWidth(0.6);
  doc.line(lx,ry,vx,ry);
  doc.setLineWidth(0.2);
  doc.line(lx,ry+1.5,vx,ry+1.5);
  ry+=6;

  // Net profit highlight
  var npColor=netProfit>=0?[232,250,240]:[254,232,232];
  doc.setFillColor(npColor[0],npColor[1],npColor[2]);
  doc.roundedRect(ML+4,ry-5,TW-8,13,2,2,"F");
  sf(9.5,"bold",netProfit>=0?14:150, netProfit>=0?100:20, netProfit>=0?50:20);
  doc.text("NET PROFIT  (Excl. GST & All Taxes)",lx+2,ry+3);
  sf(10.5,"bold",netProfit>=0?14:150, netProfit>=0?100:20, netProfit>=0?50:20);
  doc.text(fmtR(netProfit),vx,ry+3,{align:"right"});
  ry+=18;

  sf(8,"normal",80,95,120);
  doc.text("Net Profit Margin:",lx+2,ry);
  sf(8.5,"bold",109,40,217);
  doc.text(margin+"%",lx+40,ry);
  sf(8,"normal",130,145,165);
  doc.text("|",lx+56,ry);
  sf(8,"normal",80,95,120);
  doc.text(gstPay>=0?"GST Payable to Govt:":"GST Refund Due:",lx+62,ry);
  sf(8.5,"bold",gstPay>=0?180:22, gstPay>=0?83:163, gstPay>=0?9:74);
  doc.text(fmtR(Math.abs(gstPay)),lx+115,ry);
  y+=boxH+10;

  // ── RECONCILIATION NOTE ──
  checkPage(22);
  doc.setFillColor(255,252,235);
  doc.setDrawColor(251,191,36);
  doc.setLineWidth(0.3);
  doc.roundedRect(ML,y,TW,20,2,2,"FD");
  doc.setFillColor(251,191,36);
  doc.rect(ML,y+2,3,16,"F");
  sf(7,"bold",120,80,0);
  doc.text("RECONCILIATION NOTE",ML+6,y+7);
  sf(6.5,"normal",100,80,0);
  var note="All figures represent the exact Taxable Value as printed on invoices. Mixed GST slabs (5%, 12%, 18%, 28%) are handled by back-calculating base amounts from invoice totals. This ensures absolute accuracy in pre-tax profitability, independent of GST rate variations.";
  var noteLines=doc.splitTextToSize(note,TW-12);
  doc.text(noteLines,ML+6,y+13);
  y+=26;

  // ── SIGNATURE BLOCK ──
  checkPage(32);
  doc.setDrawColor(180,190,205);
  doc.setLineWidth(0.3);
  var s1=ML+5,s2=ML+TW/2+5;
  doc.line(s1,y+16,s1+55,y+16);
  doc.line(s2,y+16,s2+55,y+16);
  sf(7.5,"normal",80,95,120);
  doc.text("Authorised Signatory",s1,y+21);
  doc.text("Partner / Director",s2,y+21);
  sf(7,"normal",130,145,165);
  doc.text("Name & Designation",s1,y+26);
  doc.text("Name & Designation",s2,y+26);
  doc.text("Date: _______________",s1,y+31);
  doc.text("Date: _______________",s2,y+31);

  // ── FOOTER ALL PAGES ──
  var totalPages=doc.internal.getNumberOfPages();
  for(var i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFillColor(10,22,50);
    doc.rect(0,H-10,W,10,"F");
    doc.setFillColor(0,150,136);
    doc.rect(0,H-10,4,10,"F");
    sf(6.5,"normal",160,175,200);
    doc.text("CONFIDENTIAL  \u2014  "+firmName+"  \u2014  Financial Summary & Profitability Report (Excl. GST)",ML+2,H-4);
    sf(6.5,"normal",160,175,200);
    doc.text("Page "+i+" of "+totalPages,W-MR,H-4,{align:"right"});
  }

  var fname=firmName.replace(/\s+/g,"_")+"_PnL_"+new Date().toISOString().split("T")[0]+".pdf";
  doc.save(fname);
};
</script>

<script type="text/babel">
  var { useState, useRef, useCallback, useEffect } = React;

  var GST_RATES = [0,5,12,18,28];
  var fmt = function(n){ return "\u20B9"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var pn  = function(v){ return parseFloat(v)||0; };
  var calcGST = function(amount,rate){
    var base=amount/(1+rate/100);
    return {base:parseFloat(base.toFixed(2)),gst:parseFloat((amount-base).toFixed(2))};
  };
  var todayStr = function(){ return new Date().toISOString().split("T")[0]; };

  var C = {
    bg:"#080c14",surface:"#111827",border:"#1e293b",
    muted:"#475569",text:"#e2e8f0",sub:"#94a3b8",
    green:"#34d399",red:"#f87171",blue:"#38bdf8",
    yellow:"#fbbf24",purple:"#a78bfa",orange:"#fb923c"
  };
  var inp  = {background:C.bg,border:"1px solid "+C.border,borderRadius:"10px",padding:"12px 14px",color:C.text,fontSize:"15px",width:"100%",outline:"none"};
