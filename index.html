<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>FirmLedger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; }
    body { background: #080c14; color: #e2e8f0; font-family: 'DM Sans','Segoe UI',sans-serif; -webkit-font-smoothing: antialiased; }
    input, select, button { font-family: inherit; -webkit-appearance: none; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .page { animation: fadeUp 0.22s ease; }
    /* hide scrollbar on nav */
    .hnav::-webkit-scrollbar { display: none; }
    .hnav { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useRef, useCallback, useEffect } = React;

  const SUPABASE_URL = "https://prarfxqazcusbpfgouxc.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByYXJmeHFhemN1c2JwZmdvdXhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTc5NzQsImV4cCI6MjA5NTg3Mzk3NH0.PtbPZiGVl7uolNmZOpGD5vC-3Qnb4L-cm8bDUcJIwcA";
  const TABLE = "firm_ledger_entries";

  /* ── Supabase ── */
  const H = { "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, Prefer:"return=representation" };
  const sbFetch = async (path, opts={}) => {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers:H, ...opts });
    if (!res.ok) throw new Error(await res.text());
    const t = await res.text(); return t ? JSON.parse(t) : [];
  };
  const dbLoad   = ()    => sbFetch(`${TABLE}?select=*&order=date.desc`);
  const dbInsert = row   => sbFetch(TABLE, { method:"POST", body:JSON.stringify(row) });
  const dbDelete = id    => sbFetch(`${TABLE}?id=eq.${id}`, { method:"DELETE" });

  /* ── Helpers ── */
  const GST_RATES = [0,5,12,18,28];
  const fmt = n => "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  const pn  = v => parseFloat(v)||0;
  const calcGST = (amount,rate) => {
    const base = amount/(1+rate/100);
    return { base:parseFloat(base.toFixed(2)), gst:parseFloat((amount-base).toFixed(2)) };
  };
  const toB64 = file => new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=()=>rej(new Error("fail"));
    r.readAsDataURL(file);
  });
  const today = () => new Date().toISOString().split("T")[0];

  /* ── AI Parser ── */
  const parseInvoice = async (b64, fileType, fileName) => {
    // Normalise MIME — mobile browsers sometimes return wrong type
    let mt = fileType;
    if (!mt || mt === "application/octet-stream") {
      const ext = (fileName||"").split(".").pop().toLowerCase();
      if (ext==="pdf")                        mt = "application/pdf";
      else if (["jpg","jpeg"].includes(ext))  mt = "image/jpeg";
      else if (ext==="png")                   mt = "image/png";
      else                                    mt = "text/plain";
    }
    const isDoc = mt === "application/pdf";
    const isImg = mt.startsWith("image/");

    const instr = `You are an invoice data extractor. Extract all invoice details from this document.
Return ONLY a valid JSON object — no markdown, no explanation, no extra text:
{
  "invoiceNumber": "invoice number string or null",
  "date": "date in YYYY-MM-DD format or null",
  "partyName": "vendor or customer company/person name",
  "gstRate": 18,
  "gstAmount": 0,
  "totalAmount": 0,
  "type": "purchase or sale",
  "description": "brief description of goods or services"
}
Rules:
- type = "sale" if WE are the seller (customer billed to someone else), type = "purchase" if WE are the buyer
- If multiple GST rates exist, use the most common one
- totalAmount = grand total including GST
- gstAmount = total GST charged
- gstRate = GST percentage (e.g. 18)
- All numeric values must be plain numbers, no currency symbols`;

    let content;
    if (isDoc || isImg) {
      // Send as document/image to Claude vision
      content = [
        {
          type: isDoc ? "document" : "image",
          source: { type: "base64", media_type: mt, data: b64 }
        },
        { type: "text", text: instr }
      ];
    } else {
      // Plain text / CSV fallback
      let text = "";
      try { text = atob(b64); } catch(e) { text = b64; }
      content = instr + "\n\nINVOICE TEXT:\n" + text.slice(0, 4000);
    }

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1024,
        messages: [{ role: "user", content }]
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("API error " + res.status + ": " + errText.slice(0,200));
    }

    const data = await res.json();

    // Handle API-level errors (e.g. overloaded, invalid request)
    if (data.type === "error") throw new Error(data.error?.message || "API error");

    const raw = (data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
    if (!raw) throw new Error("Empty response from AI");

    // Find JSON object in response (handles any preamble the model adds)
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON found in: " + raw.slice(0,100));

    return JSON.parse(jsonMatch[0]);
  };


  /* ── PDF Generator ── */
  const generatePDF = (sales, purchases, expenses, all, tSB, tSG, tPB, tPG, netProfit, gstPay, margin, periodLabel, firmName, firmAddress) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    const W = doc.internal.pageSize.getWidth();   // 210
    const H = doc.internal.pageSize.getHeight();  // 297
    const ML = 14, MR = 14, TW = W - ML - MR;
    let y = 0;

    // ── colour palette ──
    const col = {
      navy:    [10, 22, 50],
      teal:    [0, 150, 136],
      tealL:   [0, 200, 180],
      white:   [255,255,255],
      offWhite:[248,249,252],
      border:  [220,226,235],
      textDark:[15,30,60],
      textMid: [80,95,120],
      textSub: [130,145,165],
      green:   [22,163,74],
      greenL:  [220,252,231],
      red:     [220,38,38],
      redL:    [254,226,226],
      amber:   [180,83,9],
      amberL:  [254,243,199],
      blue:    [37,99,235],
      blueL:   [219,234,254],
      purple:  [109,40,217],
      purpleL: [237,233,254],
    };

    // ── helpers ──
    const fmtR = n => {
      const abs = Math.abs(Number(n||0));
      const str = abs.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
      return (Number(n)<0?"(":"")+String.fromCharCode(8377)+str+(Number(n)<0?")":"");
    };
    const setFont = (size, style, rgb) => {
      doc.setFontSize(size);
      doc.setFont("helvetica", style||"normal");
      if(rgb) doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    };
    const hline = (yy, lw, rgb) => {
      doc.setDrawColor(rgb?rgb[0]:col.border[0], rgb?rgb[1]:col.border[1], rgb?rgb[2]:col.border[2]);
      doc.setLineWidth(lw||0.25);
      doc.line(ML, yy, W-MR, yy);
    };
    const checkPage = need => {
      if (y + need > H - 16) { doc.addPage(); drawPageFooter(); y = 20; }
    };

    // ── footer function (called on each page) ──
    const drawPageFooter = () => {
      const pg = doc.internal.getCurrentPageInfo().pageNumber;
      const tot = ""; // filled after
      doc.setFillColor(...col.navy);
      doc.rect(0, H-10, W, 10, "F");
      setFont(7,"normal",col.textSub);
      doc.setTextColor(160,175,200);
      doc.text("CONFIDENTIAL — "+( firmName||"FirmLedger")+" — Financial Summary Report", ML, H-4);
      doc.text("Page "+pg, W-MR, H-4, {align:"right"});
    };

    // ═══════════════════════════════════════════════════
    // PAGE 1 — COVER / HEADER
    // ═══════════════════════════════════════════════════

    // Deep navy header block
    doc.setFillColor(...col.navy);
    doc.rect(0, 0, W, 52, "F");

    // Teal left accent bar
    doc.setFillColor(...col.teal);
    doc.rect(0, 0, 4, 52, "F");

    // Firm name
    setFont(22, "bold", col.white);
    doc.text((firmName||"FirmLedger").toUpperCase(), 10, 18);

    // Underline accent
    doc.setFillColor(...col.teal);
    doc.rect(10, 20, Math.min(doc.getTextWidth((firmName||"FirmLedger").toUpperCase()), TW), 0.8, "F");

    // Address
    setFont(8, "normal", [160,175,200]);
    doc.text(firmAddress||"", 10, 27);

    // Report title
    setFont(10, "bold", col.tealL);
    doc.text("FINANCIAL SUMMARY & PROFITABILITY REPORT", 10, 37);
    setFont(8, "normal", [160,175,200]);
    doc.text("Excluding GST / Taxes  |  All figures represent exact Taxable Value", 10, 43);

    // Date right-aligned
    const genDate = new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});
    setFont(8,"normal",[160,175,200]);
    doc.text("Report Date: "+genDate, W-MR, 37, {align:"right"});
    setFont(8,"normal",[160,175,200]);
    doc.text("Period: "+periodLabel, W-MR, 43, {align:"right"});

    y = 60;

    // ── KPI summary strip ──
    const kpis = [
      { label:"Total Sales",    value:fmtR(tSB),  bg:col.greenL,  border:col.green,  text:col.green  },
      { label:"Total Costs",    value:fmtR(tPB+expenses.reduce((s,e)=>s+pn(e.base_amount),0)), bg:col.redL, border:col.red, text:col.red },
      { label:"Net Profit",     value:fmtR(netProfit), bg:netProfit>=0?col.blueL:col.redL, border:netProfit>=0?col.blue:col.red, text:netProfit>=0?col.blue:col.red },
      { label:"Net Margin",     value:margin+"%", bg:col.purpleL, border:col.purple,  text:col.purple },
    ];
    const kw = (TW - 9) / 4;
    kpis.forEach((k,i) => {
      const kx = ML + i*(kw+3);
      doc.setFillColor(...k.bg);
      doc.roundedRect(kx, y, kw, 20, 2, 2, "F");
      doc.setDrawColor(...k.border);
      doc.setLineWidth(0.4);
      doc.roundedRect(kx, y, kw, 20, 2, 2, "S");
      // top colour accent
      doc.setFillColor(...k.border);
      doc.roundedRect(kx, y, kw, 3, 2, 2, "F");
      doc.rect(kx, y+1.5, kw, 1.5, "F");
      setFont(6.5,"bold",k.border);
      doc.text(k.label.toUpperCase(), kx+4, y+9);
      setFont(10,"bold",k.text);
      doc.text(k.value, kx+4, y+17);
    });
    y += 28;

    // ── GST reconciliation strip ──
    doc.setFillColor(240,244,250);
    doc.roundedRect(ML, y, TW, 16, 2, 2, "F");
    doc.setDrawColor(...col.border);
    doc.setLineWidth(0.25);
    doc.roundedRect(ML, y, TW, 16, 2, 2, "S");
    setFont(7,"bold",col.textMid);
    doc.text("GST RECONCILIATION", ML+4, y+6);
    const gstCols = [
      { l:"Output GST (Sales)",       v:fmtR(tSG),            c:col.amber  },
      { l:"Input GST (ITC on Purchases)", v:fmtR(tPG),        c:col.purple },
      { l:gstPay>=0?"Net GST Payable":"Net GST Refund Due",  v:fmtR(Math.abs(gstPay)), c:gstPay>=0?col.red:col.green },
    ];
    const gcw = (TW-30)/3;
    gstCols.forEach((g,i)=>{
      const gx = ML+28+i*(gcw+3);
      setFont(6.5,"normal",col.textSub);
      doc.text(g.l, gx, y+6);
      setFont(9,"bold",g.c);
      doc.text(g.v, gx, y+13);
    });
    y += 24;

    // ═══════════════════════════════════════════════════
    // SECTION 1 — SALES
    // ═══════════════════════════════════════════════════
    const drawSectionHeader = (num, title, accentCol, count, total) => {
      checkPage(18);
      // Section number pill
      doc.setFillColor(...accentCol);
      doc.roundedRect(ML, y, 6, 6, 1, 1, "F");
      setFont(8,"bold",col.white);
      doc.text(num, ML+2.2, y+4.5);
      // Title
      setFont(11,"bold",col.textDark);
      doc.text(title, ML+9, y+5);
      // Count + total right
      setFont(8,"normal",col.textMid);
      doc.text(count+" entries  |  Total (ex-GST): "+total, W-MR, y+5, {align:"right"});
      y += 9;
      hline(y, 0.4, accentCol);
      y += 5;
    };

    const drawEntryTable = (rows, accentCol) => {
      if(!rows.length){
        setFont(8,"italic",col.textSub);
        doc.text("No entries for this period.", ML+4, y+4);
        y += 10; return;
      }
      const baseSum = rows.reduce((s,e)=>s+pn(e.base_amount),0);
      const gstSum  = rows.reduce((s,e)=>s+pn(e.gst_amount),0);
      const totSum  = rows.reduce((s,e)=>s+pn(e.total_amount),0);

      const body = rows.map((e,idx)=>[
        String(idx+1),
        e.invoice_number||"—",
        e.party_name||"",
        (e.description||"").slice(0,32),
        e.date||"",
        fmtR(e.total_amount),
        (e.gst_rate||0)+"%",
        fmtR(e.gst_amount),
        fmtR(e.base_amount),
      ]);

      doc.autoTable({
        startY: y,
        head: [["#","Inv. No.","Party / Vendor","Description","Date","Total Amt","GST%","GST Amt","Taxable Value (ex-GST)"]],
        body,
        foot: [["","","","","","→ "+fmtR(totSum),"","→ "+fmtR(gstSum),"→ "+fmtR(baseSum)]],
        styles:{ fontSize:7.5, cellPadding:{top:3,bottom:3,left:3,right:3}, textColor:col.textDark, fillColor:col.white, lineColor:col.border, lineWidth:0.2, overflow:"ellipsize" },
        headStyles:{ fillColor:accentCol, textColor:col.white, fontStyle:"bold", fontSize:7, cellPadding:{top:4,bottom:4,left:3,right:3} },
        footStyles:{ fillColor:col.offWhite, textColor:col.textDark, fontStyle:"bold", fontSize:7.5 },
        alternateRowStyles:{ fillColor:col.offWhite },
        margin:{ left:ML, right:MR },
        theme:"grid",
        columnStyles:{
          0:{cellWidth:6,  halign:"center"},
          1:{cellWidth:16, halign:"center"},
          2:{cellWidth:30},
          3:{cellWidth:36},
          4:{cellWidth:18, halign:"center"},
          5:{cellWidth:24, halign:"right"},
          6:{cellWidth:10, halign:"center"},
          7:{cellWidth:20, halign:"right"},
          8:{cellWidth:22, halign:"right", fontStyle:"bold"},
        },
        didParseCell: data => {
          if(data.section==="foot"){
            data.cell.styles.textColor = accentCol;
            data.cell.styles.fontStyle = "bold";
          }
        },
      });
      y = doc.lastAutoTable.finalY + 6;

      // Subtotal badge
      checkPage(10);
      doc.setFillColor(...accentCol);
      doc.roundedRect(W-MR-52, y-4, 52, 9, 1.5, 1.5, "F");
      setFont(7,"bold",col.white);
      doc.text("SUBTOTAL (ex-GST):", W-MR-50, y+1.5);
      doc.text(fmtR(baseSum), W-MR-2, y+1.5, {align:"right"});
      y += 10;
    };

    drawSectionHeader("1","VERIFIED REVENUE  —  Sales (Excl. GST)", col.green, sales.length, fmtR(tSB));
    drawEntryTable(sales, col.green);

    checkPage(14);
    drawSectionHeader("2","VERIFIED OPERATING COSTS  —  Purchases (Excl. GST)", col.red, purchases.length, fmtR(tPB));
    drawEntryTable(purchases, col.red);

    const expBase = expenses.reduce((s,e)=>s+pn(e.base_amount),0);
    if(expenses.length){
      checkPage(14);
      drawSectionHeader("3","OTHER EXPENSES  (Excl. GST)", col.amber, expenses.length, fmtR(expBase));
      drawEntryTable(expenses, col.amber);
    }

    // ═══════════════════════════════════════════════════
    // FINAL P&L STATEMENT
    // ═══════════════════════════════════════════════════
    checkPage(68);

    // Section header
    const secNum = expenses.length ? "4" : "3";
    doc.setFillColor(...col.navy);
    doc.roundedRect(ML, y, 6, 6, 1, 1, "F");
    setFont(8,"bold",col.white);
    doc.text(secNum, ML+2.2, y+4.5);
    setFont(11,"bold",col.textDark);
    doc.text("FINAL PROFITABILITY STATEMENT", ML+9, y+5);
    y += 9;
    hline(y, 0.5, col.navy);
    y += 6;

    // P&L statement box
    const boxH = 62;
    doc.setFillColor(248,250,253);
    doc.roundedRect(ML, y, TW, boxH, 3, 3, "F");
    doc.setDrawColor(...col.navy);
    doc.setLineWidth(0.4);
    doc.roundedRect(ML, y, TW, boxH, 3, 3, "S");
    // Left accent
    doc.setFillColor(...col.teal);
    doc.rect(ML, y+3, 3, boxH-6, "F");

    const plRows = [
      { label:"Total Sales Revenue",            value:tSB,                  note:"(Excl. GST)", positive:true,  isSub:false },
      { label:"Less: Total Purchase Costs",      value:-tPB,                 note:"(Excl. GST)", positive:false, isSub:false },
      { label:"Less: Other Expenses",            value:-expBase,             note:"(Excl. GST)", positive:false, isSub:false },
    ];
    let ry = y + 8;
    const lx = ML+8, vx = W-MR-4;

    plRows.forEach((r,i) => {
      setFont(8.5, "normal", col.textDark);
      doc.text(r.label, lx, ry);
      setFont(7.5, "normal", col.textSub);
      doc.text(r.note, lx+72, ry);
      setFont(8.5, "bold", r.positive ? col.green : col.red);
      doc.text(fmtR(Math.abs(r.value)), vx, ry, {align:"right"});
      if(!r.positive && r.value !== 0){
        setFont(8,"normal",col.textSub);
        doc.text("—", vx-doc.getTextWidth(fmtR(Math.abs(r.value)))-3, ry);
      }
      ry += 9;
      // dashed separator
      doc.setDrawColor(...col.border);
      doc.setLineWidth(0.15);
      doc.setLineDash([1,1.5], 0);
      doc.line(lx, ry-4, W-MR-4, ry-4);
      doc.setLineDash([], 0);
    });

    // Double rule before net profit
    ry += 1;
    hline(ry, 0.6, col.navy);
    hline(ry+1.2, 0.25, col.navy);
    ry += 6;

    // NET PROFIT row — big
    doc.setFillColor(...(netProfit>=0?col.greenL:col.redL));
    doc.roundedRect(ML+5, ry-5, TW-10, 13, 2, 2, "F");
    setFont(10,"bold", netProfit>=0?col.green:col.red);
    doc.text("NET PROFIT  (Excl. GST & Taxes)", lx+2, ry+3);
    setFont(11,"bold", netProfit>=0?col.green:col.red);
    doc.text(fmtR(netProfit), vx, ry+3, {align:"right"});
    ry += 18;

    // Net margin + GST payable inline
    setFont(8,"normal",col.textMid);
    doc.text("Net Profit Margin:", lx+2, ry);
    setFont(8,"bold",col.purple);
    doc.text(margin+"%", lx+38, ry);
    doc.text("|", lx+52, ry);
    setFont(8,"normal",col.textMid);
    doc.text(gstPay>=0?"GST Payable to Govt:":"GST Refund Due:", lx+57, ry);
    setFont(8,"bold",gstPay>=0?col.amber:col.green);
    doc.text(fmtR(Math.abs(gstPay)), lx+105, ry);

    y += boxH + 10;

    // ── Reconciliation note ──
    checkPage(20);
    doc.setFillColor(255,252,235);
    doc.setDrawColor(251,191,36);
    doc.setLineWidth(0.3);
    doc.roundedRect(ML, y, TW, 18, 2, 2, "FD");
    doc.setFillColor(251,191,36);
    doc.rect(ML, y+2, 3, 14, "F");
    setFont(7,"bold",[120,80,0]);
    doc.text("RECONCILIATION NOTE", ML+6, y+6);
    setFont(6.5,"normal",[100,80,0]);
    const note = "All figures represent the exact Taxable Value as printed on invoices. Mixed GST slabs (5%, 12%, 18%, 28%) are handled by back-calculating base amounts from invoice totals. This methodology ensures absolute accuracy in pre-tax profitability independent of GST rate variations.";
    con
